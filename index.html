<svg width="50" height="50" viewBox="0 0 500 500" style="vertical-align: middle; flex-shrink: 0; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 3D Blue Sphere Gradient for Globe -->
    <radialGradient id="globeSphere" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#70d6ff" />
      <stop offset="25%" stop-color="#00a8e8" />
      <stop offset="65%" stop-color="#007ea7" />
      <stop offset="90%" stop-color="#003459" />
      <stop offset="100%" stop-color="#00172e" />
    </radialGradient>
    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077b6" />
      <stop offset="50%" stop-color="#023e8a" />
      <stop offset="100%" stop-color="#03045e" />
    </linearGradient>
    <!-- Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#002855" />
      <stop offset="50%" stop-color="#00509d" />
      <stop offset="100%" stop-color="#002855" />
    </linearGradient>
  </defs>

  <!-- Outer Ring with White Border -->
  <circle cx="250" cy="225" r="218" fill="url(#ringGrad)" stroke="#ffffff" stroke-width="7" />
  <circle cx="250" cy="225" r="148" fill="none" stroke="#ffffff" stroke-width="5" />

  <!-- Circular Texts inside the Blue Ring -->
  <path id="arcTop" d="M 68 225 A 182 182 0 0 1 432 225" fill="none" />
  <path id="arcBottom" d="M 235 407 A 182 182 0 0 1 68 225" fill="none" />

  <text fill="#ffffff" font-family="'Arial Black', Impact, sans-serif" font-size="21" font-weight="900" letter-spacing="1.5">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">
      EDUCATION | SUPPORT FOR INNOVATIONS
    </textPath>
  </text>
  <text fill="#ffffff" font-family="'Arial Black', Impact, sans-serif" font-size="20" font-weight="900" letter-spacing="1.5">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">
      TOOLS | TECHNOLOGY |
    </textPath>
  </text>

  <!-- Center Globe Sphere -->
  <circle cx="250" cy="225" r="142" fill="url(#globeSphere)" stroke="#ffffff" stroke-width="4" />

  <!-- Globe Longitudes and Latitudes (White grid) -->
  <ellipse cx="250" cy="225" rx="68" ry="142" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.45" />
  <ellipse cx="250" cy="225" rx="115" ry="142" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.35" />
  <line x1="108" y1="225" x2="392" y2="225" stroke="#ffffff" stroke-width="2.5" opacity="0.45" />
  <line x1="126" y1="170" x2="374" y2="170" stroke="#ffffff" stroke-width="2" opacity="0.35" />
  <line x1="126" y1="280" x2="374" y2="280" stroke="#ffffff" stroke-width="2" opacity="0.35" />

  <!-- Continents Map Silhouettes (North & South America) -->
  <path d="M 180 145 Q 215 130 240 155 Q 260 170 230 195 Q 200 205 175 175 Z" fill="#ffffff" opacity="0.95" />
  <path d="M 215 210 Q 250 205 270 235 Q 265 285 240 315 Q 220 290 215 245 Z" fill="#ffffff" opacity="0.95" />
  <path d="M 290 145 Q 330 140 345 170 Q 320 195 295 180 Z" fill="#ffffff" opacity="0.95" />
  <path d="M 305 210 Q 345 220 335 265 Q 295 255 305 210 Z" fill="#ffffff" opacity="0.95" />

  <!-- Specular Reflection Highlight on Globe -->
  <ellipse cx="215" cy="165" rx="75" ry="42" fill="#ffffff" opacity="0.3" transform="rotate(-28 215 165)" />

  <!-- Open Book / Wings Silhouette at Bottom of Globe -->
  <path d="M 105 325 Q 180 300 250 355 Q 320 300 395 325 L 385 365 Q 315 340 250 385 Q 185 340 115 365 Z" fill="#001833" stroke="#ffffff" stroke-width="4" />
  <path d="M 130 342 Q 190 325 250 365 Q 310 325 370 342" fill="none" stroke="#ffffff" stroke-width="3" />

  <!-- Bottom Ribbon Tails -->
  <path d="M 30 405 L 90 375 L 75 435 Z" fill="#001833" stroke="#0077b6" stroke-width="3" />
  <path d="M 470 405 L 410 375 L 425 435 Z" fill="#001833" stroke="#0077b6" stroke-width="3" />

  <!-- Curved Bottom Ribbon Banner -->
  <path d="M 45 415 Q 250 365 455 415 L 440 470 Q 250 420 60 470 Z" fill="url(#ribbonGrad)" stroke="#ffffff" stroke-width="5" />

  <!-- Ribbon Text: EDWIN INCORPORATION -->
  <path id="ribbonTextArc" d="M 60 454 Q 250 404 440 454" fill="none" />
  <text fill="#ffffff" font-family="'Arial Black', Impact, sans-serif" font-size="34" font-weight="900" letter-spacing="3.5">
    <textPath href="#ribbonTextArc" startOffset="50%" text-anchor="middle">
      EDWIN INCORPORATION
    </textPath>
  </text>
</svg>
